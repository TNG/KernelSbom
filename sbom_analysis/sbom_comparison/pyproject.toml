[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbom-compare"
version = "0.1.0"
description = "Semantic comparison of SPDX SBOM documents generated by the kernel sbom tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sbom-compare = "sbom_compare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sbom_compare"]
